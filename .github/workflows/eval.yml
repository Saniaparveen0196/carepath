name: eval
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build the fictional demo workspace
        run: |
          python scripts/make_synthetic.py synthetic
          python cli.py import-csv synthetic
          python cli.py eval-init synthetic
      - name: Quality gate (ranker properties, guardrails, routing)
        run: python cli.py eval synthetic --offline
      - name: Does the gate catch injected bugs?
        run: python scripts/mutation_check.py synthetic